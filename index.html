<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Materi PSPT</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1770296394/logo-pspt_pdvdab.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header img {
      width: 90px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      color: #111;
      margin-bottom: 6px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    form {
      display: grid;
      gap: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button, .link-btn {
      flex: 1;
      min-width: 150px;
      text-align: center;
      padding: 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }

    button {
      background: linear-gradient(135deg, #d60000, #ffcc00);
      color: #111;
    }

    button:hover {
      opacity: 0.9;
    }

    .link-btn {
      background: #111;
      color: #fff;
    }

    .link-btn:hover {
      background: #333;
    }

    @media (max-width: 768px) {
      .container {
        padding: 18px;
      }

      .header h1 {
        font-size: 22px;
      }

      input, textarea, button, .link-btn {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="https://res.cloudinary.com/do3jvxebp/image/upload/v1770296394/logo-pspt_pdvdab.png" alt="Logo PSPT">
      <h1>Tambah Materi PSPT</h1>
      <p>Input materi pembelajaran digital guru & siswa</p>
    </div>

    <form id="materiForm">
      <input type="text" id="kode" placeholder="Kode Materi (contoh: PSPT001)" required>
      <input type="text" id="mapel" placeholder="Mata Pelajaran" required>
      <textarea id="materi" placeholder="Isi Materi" required></textarea>

      <input type="text" id="gambar" placeholder="Link Gambar">
      <input type="text" id="video" placeholder="Link Video">
      <input type="text" id="audio" placeholder="Link Audio">
      <input type="text" id="ppt" placeholder="Link PPT">

      <div class="btn-group">
        <button type="submit">Simpan Materi</button>
        <a href="materi.html" class="link-btn">Kembali ke Materi</a>
      </div>
    </form>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/materi.js"></script>

</body>
</html>
