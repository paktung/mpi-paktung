<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Materi PSPT</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/do3jvxebp/image/upload/v1770296394/logo-pspt_pdvdab.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header img {
      width: 90px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .top-btn {
      display: inline-block;
      margin: 20px 0;
      padding: 12px 20px;
      background: linear-gradient(135deg, #d60000, #ffcc00);
      color: #111;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
    }

    .materi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #111;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card p {
      margin-bottom: 10px;
      line-height: 1.6;
      color: #444;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .links a {
      display: inline-block;
      margin: 4px 6px 4px 0;
      padding: 8px 12px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }

    .aksi {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .edit-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: #ffcc00;
      color: #111;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 24px;
      }

      .card h3 {
        font-size: 18px;
      }

      .top-btn {
        width: 100%;
        text-align: center;
      }
    }
    /* =========================
TAMBAHKAN KE <style> materi.html
========================= */

.materi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 24px;
}

.card {
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 24px rgba(0,0,0,0.08);
  border: 1px solid #eee;
  transition: transform 0.3s ease;
}

.card:hover {
  transform: translateY(-4px);
}

.materi-img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.card-content {
  padding: 18px;
}

.badge {
  display: inline-block;
  background: linear-gradient(135deg, #d60000, #ffcc00);
  color: #111;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}

.card h3 {
  font-size: 22px;
  margin-bottom: 12px;
}

.card p {
  color: #444;
  line-height: 1.7;
}

.video-wrapper {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  margin-top: 15px;
  border-radius: 14px;
  overflow: hidden;
}

.video-wrapper iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
}

.resource-links {
  margin-top: 15px;
}

.resource-links a {
  display: inline-block;
  margin-right: 8px;
  margin-bottom: 8px;
  padding: 10px 14px;
  background: #111;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 14px;
}

.aksi {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.edit-btn,
.save-btn {
  flex: 1;
  border: none;
  padding: 12px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

.edit-btn {
  background: #ffcc00;
}

.save-btn {
  background: #d60000;
  color: white;
}

.edit-form {
  margin-top: 12px;
}

.edit-form input,
.edit-form textarea {
  width: 100%;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.edit-form textarea {
  min-height: 140px;
}

.hidden {
  display: none;
}

@media (max-width: 768px) {
  .card h3 {
    font-size: 19px;
  }

  .materi-img {
    height: 200px;
  }
}

    /* =========================================
TAMBAHKAN KE STYLE materi.html
========================================= */

.komentar-box {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid #ddd;
}

.komentar-box h4 {
  margin-bottom: 14px;
  font-size: 18px;
}

.komentar-form input,
.komentar-form textarea,
.reply-form input,
.reply-form textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

.komentar-form textarea,
.reply-form textarea {
  min-height: 80px;
}

.komentar-form button,
.reply-form button,
.reply-toggle {
  padding: 10px 14px;
  border: none;
  background: #111;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.komentar-item {
  padding: 12px;
  border: 1px solid #eee;
  border-radius: 12px;
  margin-bottom: 12px;
  background: #fafafa;
}

.komentar-item strong {
  display: block;
  margin-bottom: 5px;
}

.reply-list {
  margin-top: 10px;
  margin-left: 18px;
}

.reply-item {
  background: #fff;
  border-left: 3px solid #ffcc00;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
}

.reply-form {
  margin-top: 10px;
}

.reply-toggle {
  margin-top: 8px;
  background: #ffcc00;
  color: #111;
}

.hidden {
  display: none;
}
  </style>
</head>

    <div class="header">

      <h1>Daftar Materi PSPT</h1>
